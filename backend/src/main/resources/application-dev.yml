# Local development profile.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:employee_db}?useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:employee_app}
    password: ${DB_PASSWORD:employee_app}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

logging:
  level:
    com.example.employee: DEBUG
