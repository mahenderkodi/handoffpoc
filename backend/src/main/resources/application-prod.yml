# Production-like profile. No local-default credentials here on purpose — every value is
# required from the environment (Section 12); the app fails fast at startup if one is missing.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  sql:
    init:
      # Automatic SQL init only ever runs in dev/test — never in a production-like environment.
      mode: never
